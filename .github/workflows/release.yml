name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package extension zip & SHA256 checksums
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw 'package.json' | ConvertFrom-Json
          $ver = $pkg.version
          $extZip = "release/snipr-extension-$ver.zip"
          Compress-Archive -Path 'extension/*' -DestinationPath $extZip -Force

          $installer = Get-ChildItem 'release/*.exe' | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer .exe not found in release/' }

          $artifacts = @($installer.FullName, $extZip)
          $blockmap = Get-ChildItem 'release/*.blockmap' | Select-Object -First 1
          if ($blockmap) { $artifacts += $blockmap.FullName }

          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Path $file -Leaf
            "$hash  $name"
          }
          $lines | Out-File -FilePath 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/snipr-extension-*.zip
            release/SHA256SUMS.txt
