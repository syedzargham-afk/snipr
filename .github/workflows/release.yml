name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary is installed
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0 -and (Test-Path 'node_modules/electron/dist/electron.exe')) {
              break
            }
            Write-Warning "Electron install attempt $i failed; retrying..."
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron binary missing at node_modules/electron/dist/electron.exe after install.js'
          }

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          npm run build:renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package extension zip & SHA256 checksums
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw 'package.json' | ConvertFrom-Json
          $ver = $pkg.version
          $extZip = "release/snipr-extension-$ver.zip"
          Compress-Archive -Path 'extension/*' -DestinationPath $extZip -Force

          $installerPath = "release/Snipr-Setup-$ver.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Expected NSIS installer not found at $installerPath"
          }
          $installer = Get-Item $installerPath

          $artifacts = @($installer.FullName, (Resolve-Path $extZip).Path)
          $blockmapPath = "release/Snipr-Setup-$ver.exe.blockmap"
          if (Test-Path $blockmapPath) {
            $artifacts += (Resolve-Path $blockmapPath).Path
          }

          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Path $file -Leaf
            "$hash  $name"
          }
          $lines | Out-File -FilePath 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: snipr-windows-release
          if-no-files-found: error
          path: |
            release/Snipr-Setup-*.exe
            release/Snipr-Setup-*.exe.blockmap
            release/snipr-extension-*.zip
            release/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            release/Snipr-Setup-*.exe
            release/Snipr-Setup-*.exe.blockmap
            release/snipr-extension-*.zip
            release/SHA256SUMS.txt
